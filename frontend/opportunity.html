<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOOP — Opportunity Details</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: 'var(--background)',
            foreground: 'var(--foreground)',
            primary: 'var(--primary)',
            'primary-foreground': 'var(--primary-foreground)',
            secondary: 'var(--secondary)',
            'secondary-foreground': 'var(--secondary-foreground)',
            muted: 'var(--muted)',
            'muted-foreground': 'var(--muted-foreground)',
            border: 'var(--border)',
            lime: 'var(--lime)',
            amber: 'var(--amber)',
            indigo: 'var(--indigo)',
          },
          fontFamily: {
            display: ['Anton', 'Impact', 'sans-serif'],
            body: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-background text-foreground">

  <!-- Sticky Ticker Banner -->
  <div class="sticky top-0 z-50 bg-primary text-primary-foreground py-1.5 overflow-hidden border-b-2 border-foreground">
    <div id="marquee-ticker" class="marquee-content gap-10 whitespace-nowrap font-mono text-[11px] font-bold uppercase tracking-tight">
      <span class="inline-flex items-center gap-3">
        <span>LOOP · Loading opportunities</span>
        <span class="opacity-50">✦</span>
      </span>
    </div>
  </div>

  <!-- Header -->
  <header class="sticky top-[28px] z-40 bg-background/80 backdrop-blur-md border-b-2 border-foreground/10">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between gap-4">
      <a href="/" class="font-display text-3xl uppercase tracking-tighter italic leading-none shrink-0">
        LOOP<span class="text-primary">.</span>
      </a>
      <nav id="header-nav" class="flex items-center gap-1"></nav>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto px-6 py-10 lg:py-14 animate-entry">
    
    <a href="/" class="inline-flex items-center gap-2 font-mono text-[10px] font-bold uppercase tracking-wider text-muted-foreground hover:text-foreground mb-8">
      <i data-lucide="arrow-left" class="size-3.5"></i> Back to feed
    </a>

    <div id="detail-card" class="bg-card border-2 border-foreground rounded-3xl p-6 md:p-10 shadow-stamp-lg flex flex-col gap-6 md:gap-8">
      <div class="text-center font-mono text-xs uppercase text-muted-foreground py-10">Loading opportunity details...</div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="border-t-2 border-foreground/10 mt-24 py-10">
    <div class="max-w-6xl mx-auto px-6 flex flex-col md:flex-row justify-between items-start gap-6">
      <div>
        <div class="font-display text-3xl uppercase tracking-tighter italic">LOOP.</div>
        <p class="font-mono text-[10px] uppercase text-muted-foreground tracking-widest mt-2">v.03 — built for the curious</p>
      </div>
      <div class="font-mono text-[10px] uppercase tracking-widest text-muted-foreground">
        © 2026 · No more missed deadlines.
      </div>
    </div>
  </footer>

  <script src="/common.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // Guard page
      const user = await requireAuth();
      if (!user) return;

      renderHeader(user);
      initMarqueeTicker();

      const oppId = window.location.pathname.split("/").pop();
      const detailCard = document.getElementById("detail-card");

      const categoryColors = {
        internship: "bg-primary text-primary-foreground",
        scholarship: "bg-secondary text-secondary-foreground",
        competition: "bg-foreground text-background",
        fellowship: "bg-indigo-600 text-white",
        hackathon: "bg-lime text-foreground border border-foreground/10"
      };

      try {
        const oppRes = await fetch(`/api/opportunities/${oppId}`);
        if (!oppRes.ok) {
          throw new Error("Opportunity not found");
        }
        const opp = await oppRes.json();

        const profileRes = await fetch("/api/user/profile");
        if (!profileRes.ok) return;
        const profileData = await profileRes.json();

        let matchData = null;
        try {
          const matchRes = await fetch(`/api/opportunities/${opp.id}/match`);
          if (matchRes.ok) {
            matchData = await matchRes.json();
          }
        } catch (mErr) {
          console.warn("Could not fetch server match details:", mErr);
        }

        const score = matchData?.finalMatchScore !== undefined
          ? matchData.finalMatchScore
          : getMatchScore(profileData.profile, opp.tags || []);
        const eligibility = matchData?.eligibility || null;
        const breakdown = matchData?.scoreBreakdown || null;
        const matchedSkills = matchData?.matchedSkills || [];
        const missingSkills = matchData?.missingSkills || [];
        const matchedInterests = matchData?.matchedInterests || [];
        const reasons = matchData?.reasons || [];

        const whyThisMatches = matchData?.whyThisMatches || getWhyThisMatches(opp, profileData.profile, {
          saved: profileData.saved,
          interested: profileData.interested,
          passed: profileData.passed,
          applied: profileData.applied
        });
        const whySectionHtml = renderWhyThisMatchesSection(whyThisMatches, { compact: false });

        const daysLeft = formatDeadline(opp.deadline);
        const colorClass = categoryColors[opp.category] || "bg-foreground text-background";
        const isSaved = profileData.saved.includes(opp.id);
        const isApplied = profileData.applied.includes(opp.id);

        let eligibilityBadge = "";
        if (eligibility) {
          if (eligibility.status === "PASS") {
            eligibilityBadge = `<span class="px-2.5 py-0.5 rounded-full font-mono text-[9px] font-bold uppercase bg-emerald-500/20 text-emerald-600 border border-emerald-500/30 flex items-center gap-1"><i data-lucide="shield-check" class="size-3"></i> Eligible</span>`;
          } else if (eligibility.status === "FAIL") {
            eligibilityBadge = `<span class="px-2.5 py-0.5 rounded-full font-mono text-[9px] font-bold uppercase bg-destructive/15 text-destructive border border-destructive/30 flex items-center gap-1"><i data-lucide="shield-alert" class="size-3"></i> Ineligible</span>`;
          } else {
            eligibilityBadge = `<span class="px-2.5 py-0.5 rounded-full font-mono text-[9px] font-bold uppercase bg-amber-500/20 text-amber-600 border border-amber-500/30 flex items-center gap-1"><i data-lucide="alert-circle" class="size-3"></i> Conditional</span>`;
          }
        }

        detailCard.innerHTML = `
          <!-- Header info -->
          <div class="flex flex-col md:flex-row justify-between items-start gap-4 border-b border-foreground/10 pb-6">
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-2 mb-3 flex-wrap">
                <span class="px-2.5 py-0.5 rounded-full font-mono text-[9px] font-bold uppercase tracking-tight ${colorClass}">
                  ${opp.category}
                </span>
                <span class="px-2.5 py-0.5 bg-muted rounded-full font-mono text-[9px] text-muted-foreground uppercase">
                  ${opp.location}
                </span>
                ${opp.work_mode ? `
                  <span class="px-2.5 py-0.5 bg-muted rounded-full font-mono text-[9px] text-muted-foreground uppercase">
                    ${opp.work_mode}
                  </span>
                ` : ""}
                ${eligibilityBadge}
              </div>
              <h1 class="font-display text-4xl md:text-5xl uppercase tracking-tight leading-[0.95]">${opp.title}</h1>
              <div class="font-mono text-xs uppercase text-muted-foreground mt-2">${opp.organization}</div>
            </div>

            <div class="flex flex-col md:items-end gap-1.5 shrink-0 bg-primary/5 p-4 border-2 border-primary/20 rounded-2xl">
              <div class="flex items-center gap-2">
                <span class="font-mono text-[10px] text-primary font-bold uppercase">MATCH SCORE</span>
                ${eligibilityBadge}
              </div>
              <span class="font-display text-4xl text-primary leading-none">${score}%</span>
              <span class="font-mono text-[9px] text-muted-foreground uppercase">Deterministic & Explainable</span>
            </div>
          </div>

          <!-- Attributes Grid -->
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4 bg-muted/40 p-4 border-2 border-foreground/10 rounded-2xl">
            <div>
              <div class="font-mono text-[9px] text-muted-foreground uppercase">DAYS REMAINING</div>
              <div class="font-bold text-sm uppercase mt-0.5">${daysLeft}</div>
            </div>
            <div>
              <div class="font-mono text-[9px] text-muted-foreground uppercase">PRIZE / REWARD</div>
              <div class="font-bold text-sm uppercase mt-0.5">${opp.prize_amount || "N/A"}</div>
            </div>
            <div>
              <div class="font-mono text-[9px] text-muted-foreground uppercase">EST. PARTICIPANTS</div>
              <div class="font-bold text-sm uppercase mt-0.5">${opp.participants || "N/A"}</div>
            </div>
            <div>
              <div class="font-mono text-[9px] text-muted-foreground uppercase">VERIFIED STATUS</div>
              <div class="font-bold text-sm uppercase mt-0.5 flex items-center gap-1 text-primary">
                <i data-lucide="check-circle-2" class="size-4 shrink-0"></i> Verified
              </div>
            </div>
          </div>

          <!-- Description content -->
          <div class="space-y-4">
            <h3 class="font-display text-2xl uppercase tracking-tight">Program Description</h3>
            <p class="font-sans text-sm leading-relaxed text-foreground/80">${opp.description}</p>
          </div>

          <!-- Dedicated "Why this matches" section -->
          ${whySectionHtml}

          <!-- Matching Intelligence & Explainability Breakdown -->
          <div class="border-t border-foreground/10 pt-6 space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div>
                <h3 class="font-display text-2xl uppercase tracking-tight flex items-center gap-2">
                  <i data-lucide="cpu" class="size-5 text-primary"></i> Matching Intelligence Breakdown
                </h3>
                <p class="font-mono text-[10px] uppercase text-muted-foreground mt-0.5">
                  Multi-factor deterministic evaluation with eligibility constraint enforcement
                </p>
              </div>
              ${eligibility ? `
                <div class="font-mono text-xs font-bold uppercase">
                  Constraint Status: <span class="${eligibility.status === 'PASS' ? 'text-emerald-600' : eligibility.status === 'FAIL' ? 'text-destructive' : 'text-amber-600'}">${eligibility.status}</span>
                </div>
              ` : ""}
            </div>

            ${eligibility && eligibility.status === "FAIL" && eligibility.blockers?.length > 0 ? `
              <div class="p-4 bg-destructive/10 border-2 border-destructive/30 rounded-xl space-y-2">
                <div class="font-mono text-xs font-bold uppercase text-destructive flex items-center gap-2">
                  <i data-lucide="alert-octagon" class="size-4"></i> Eligibility Constraint Violation (Score Constrained to 0)
                </div>
                <ul class="list-disc list-inside text-xs font-mono text-destructive/90 space-y-1">
                  ${eligibility.blockers.map(b => `<li>${b}</li>`).join("")}
                </ul>
              </div>
            ` : ""}

            <!-- Matched & Missing Skills -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="p-4 bg-muted/40 border border-foreground/10 rounded-xl space-y-2">
                <div class="font-mono text-[10px] font-bold uppercase tracking-wider text-muted-foreground flex items-center gap-1.5">
                  <i data-lucide="check" class="size-3.5 text-emerald-600"></i> Matched Skills & Interests
                </div>
                <div class="flex flex-wrap gap-1.5">
                  ${matchedSkills.length > 0 || matchedInterests.length > 0 ? `
                    ${matchedSkills.map(s => `<span class="px-2 py-0.5 bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 border border-emerald-500/30 rounded-full font-mono text-[10px] uppercase font-bold">✓ ${s}</span>`).join("")}
                    ${matchedInterests.map(i => `<span class="px-2 py-0.5 bg-blue-500/15 text-blue-700 dark:text-blue-300 border border-blue-500/30 rounded-full font-mono text-[10px] uppercase font-bold">★ ${i}</span>`).join("")}
                  ` : `<span class="font-mono text-xs text-muted-foreground italic">None specifically matched</span>`}
                </div>
              </div>

              <div class="p-4 bg-muted/40 border border-foreground/10 rounded-xl space-y-2">
                <div class="font-mono text-[10px] font-bold uppercase tracking-wider text-muted-foreground flex items-center gap-1.5">
                  <i data-lucide="book-open" class="size-3.5 text-amber-600"></i> Missing Skills to Target
                </div>
                <div class="flex flex-wrap gap-1.5">
                  ${missingSkills.length > 0 ? missingSkills.map(s => `
                    <span class="px-2 py-0.5 bg-amber-500/15 text-amber-700 dark:text-amber-300 border border-amber-500/30 rounded-full font-mono text-[10px] uppercase font-bold">○ ${s}</span>
                  `).join("") : `<span class="font-mono text-xs text-emerald-600 font-bold">✓ No missing required skills</span>`}
                </div>
              </div>
            </div>

            <!-- 8 Scoring Dimensions Grid -->
            ${breakdown ? `
              <div class="space-y-3">
                <div class="font-mono text-[10px] font-bold uppercase tracking-wider text-muted-foreground">
                  Score Dimensions (8 Factors)
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                  ${[
                    { key: "skills", label: "Skills", weight: "25%", val: breakdown.skills?.score || 0 },
                    { key: "interests", label: "Interests", weight: "15%", val: breakdown.interests?.score || 0 },
                    { key: "category", label: "Category", weight: "15%", val: breakdown.category?.score || 0 },
                    { key: "location", label: "Location", weight: "15%", val: breakdown.location?.score || 0 },
                    { key: "experience", label: "Experience", weight: "10%", val: breakdown.experience?.score || 0 },
                    { key: "behavior", label: "Behavior", weight: "10%", val: breakdown.behavior?.score || 0 },
                    { key: "urgency", label: "Urgency", weight: "5%", val: breakdown.urgency?.score || 0 },
                    { key: "recency", label: "Recency", weight: "5%", val: breakdown.recency?.score || 0 },
                  ].map(dim => `
                    <div class="p-3 bg-card border border-foreground/15 rounded-xl flex flex-col justify-between">
                      <div class="flex justify-between items-start">
                        <span class="font-mono text-[10px] uppercase font-bold text-muted-foreground">${dim.label}</span>
                        <span class="font-mono text-[9px] text-muted-foreground">${dim.weight}</span>
                      </div>
                      <div class="mt-2 flex items-baseline justify-between">
                        <span class="font-display text-2xl">${dim.val}%</span>
                      </div>
                      <div class="w-full bg-muted h-1.5 rounded-full overflow-hidden mt-1.5">
                        <div class="bg-primary h-full transition-all duration-300" style="width: ${dim.val}%"></div>
                      </div>
                    </div>
                  `).join("")}
                </div>
              </div>
            ` : ""}

            <!-- Deterministic Reasons -->
            ${reasons.length > 0 ? `
              <div class="space-y-2">
                <div class="font-mono text-[10px] font-bold uppercase tracking-wider text-muted-foreground">
                  Explainable Reasons
                </div>
                <div class="p-4 bg-muted/30 border border-foreground/10 rounded-xl space-y-1.5 font-mono text-xs">
                  ${reasons.map(r => `
                    <div class="flex items-start gap-2">
                      <span class="text-primary font-bold shrink-0">›</span>
                      <span>${r}</span>
                    </div>
                  `).join("")}
                </div>
              </div>
            ` : ""}
          </div>

          <!-- Tags list -->
          <div class="space-y-2 border-t border-foreground/10 pt-6">
            <div class="font-mono text-[9px] text-muted-foreground uppercase">ALL TAGS & METADATA</div>
            <div class="flex flex-wrap gap-1.5">
              ${(opp.tags || []).map(t => `
                <span class="px-2.5 py-1 bg-muted rounded-full font-mono text-[10px] uppercase">${t}</span>
              `).join("")}
            </div>
          </div>

          <!-- CTA Buttons section -->
          <div class="flex flex-wrap items-center justify-between gap-4 border-t border-foreground/10 pt-6 mt-4">
            <div class="flex gap-2 w-full md:w-auto">
              <button 
                id="bookmark-btn"
                class="flex-1 md:flex-none px-6 py-3.5 border-2 border-foreground rounded-xl font-mono text-xs font-bold uppercase transition-all flex items-center justify-center gap-2 ${isSaved ? 'bg-foreground text-background' : 'hover:bg-foreground/5'}"
              >
                <i data-lucide="bookmark" class="size-4"></i> ${isSaved ? "Saved" : "Save Opportunity"}
              </button>
              
              <button 
                id="applied-btn"
                class="flex-1 md:flex-none px-6 py-3.5 border-2 border-foreground rounded-xl font-mono text-xs font-bold uppercase transition-all flex items-center justify-center gap-2 ${isApplied ? 'bg-primary border-primary text-primary-foreground' : 'hover:bg-foreground/5'}"
              >
                <i data-lucide="check-square" class="size-4"></i> ${isApplied ? "Applied" : "Mark Applied"}
              </button>
            </div>

            ${opp.apply_url ? `
              <a 
                href="${opp.apply_url}" 
                target="_blank" 
                class="w-full md:w-auto px-8 py-4 bg-foreground text-background border-2 border-foreground rounded-xl font-mono text-xs font-bold uppercase hover:bg-primary hover:border-primary transition-all text-center flex items-center justify-center gap-2"
              >
                Apply Externally <i data-lucide="external-link" class="size-4"></i>
              </a>
            ` : ""}
          </div>
        `;

        if (window.lucide) window.lucide.createIcons();

        // Event listener for Bookmark/Save button
        document.getElementById("bookmark-btn").addEventListener("click", async () => {
          const btn = document.getElementById("bookmark-btn");
          const res = await fetch("/api/user/saved/toggle", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: opp.id })
          });
          if (res.ok) {
            const data = await res.json();
            if (data.saved) {
              btn.className = "flex-1 md:flex-none px-6 py-3.5 border-2 border-foreground rounded-xl font-mono text-xs font-bold uppercase transition-all flex items-center justify-center gap-2 bg-foreground text-background";
              btn.innerHTML = `<i data-lucide="bookmark" class="size-4"></i> Saved`;
            } else {
              btn.className = "flex-1 md:flex-none px-6 py-3.5 border-2 border-foreground rounded-xl font-mono text-xs font-bold uppercase transition-all flex items-center justify-center gap-2 hover:bg-foreground/5";
              btn.innerHTML = `<i data-lucide="bookmark" class="size-4"></i> Save Opportunity`;
            }
            if (window.lucide) window.lucide.createIcons();
          }
        });

        // Event listener for Mark Applied button
        document.getElementById("applied-btn").addEventListener("click", async () => {
          const btn = document.getElementById("applied-btn");
          const res = await fetch("/api/user/applied/toggle", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: opp.id })
          });
          if (res.ok) {
            const data = await res.json();
            if (data.applied) {
              btn.className = "flex-1 md:flex-none px-6 py-3.5 border-2 border-foreground rounded-xl font-mono text-xs font-bold uppercase transition-all flex items-center justify-center gap-2 bg-primary border-primary text-primary-foreground";
              btn.innerHTML = `<i data-lucide="check-square" class="size-4"></i> Applied`;
            } else {
              btn.className = "flex-1 md:flex-none px-6 py-3.5 border-2 border-foreground rounded-xl font-mono text-xs font-bold uppercase transition-all flex items-center justify-center gap-2 hover:bg-foreground/5";
              btn.innerHTML = `<i data-lucide="check-square" class="size-4"></i> Mark Applied`;
            }
            if (window.lucide) window.lucide.createIcons();
          }
        });

      } catch (err) {
        detailCard.innerHTML = `<div class="text-center font-mono text-xs uppercase text-destructive py-10">Error loading details: ${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
