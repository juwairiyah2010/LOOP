<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOOP — Saved Opportunities</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: 'var(--background)',
            foreground: 'var(--foreground)',
            primary: 'var(--primary)',
            'primary-foreground': 'var(--primary-foreground)',
            secondary: 'var(--secondary)',
            'secondary-foreground': 'var(--secondary-foreground)',
            muted: 'var(--muted)',
            'muted-foreground': 'var(--muted-foreground)',
            border: 'var(--border)',
            lime: 'var(--lime)',
            amber: 'var(--amber)',
            indigo: 'var(--indigo)',
          },
          fontFamily: {
            display: ['Anton', 'Impact', 'sans-serif'],
            body: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-background text-foreground">

  <!-- Sticky Ticker Banner -->
  <div class="sticky top-0 z-50 bg-primary text-primary-foreground py-1.5 overflow-hidden border-b-2 border-foreground">
    <div id="marquee-ticker" class="marquee-content gap-10 whitespace-nowrap font-mono text-[11px] font-bold uppercase tracking-tight">
      <span class="inline-flex items-center gap-3">
        <span>LOOP · Loading opportunities</span>
        <span class="opacity-50">✦</span>
      </span>
    </div>
  </div>

  <!-- Header -->
  <header class="sticky top-[28px] z-40 bg-background/80 backdrop-blur-md border-b-2 border-foreground/10">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between gap-4">
      <a href="/" class="font-display text-3xl uppercase tracking-tighter italic leading-none shrink-0">
        LOOP<span class="text-primary">.</span>
      </a>
      <nav id="header-nav" class="flex items-center gap-1"></nav>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto px-6 py-10 lg:py-14 animate-entry">
    
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-8">
      <div>
        <div id="page-subtitle" class="font-mono text-[10px] uppercase tracking-widest text-muted-foreground">
          Your Watchlist · <span id="current-month"></span>
        </div>
        <h1 id="page-title" class="font-display text-5xl md:text-6xl uppercase tracking-tighter italic leading-none mt-1">
          Saved Items<span class="text-primary">.</span>
        </h1>
      </div>
      
      <!-- Tab Toggles: Saved, Interested, Applied -->
      <div class="flex p-1 bg-muted rounded-xl border-2 border-foreground self-start md:self-auto shadow-stamp gap-1 flex-wrap">
        <button id="tab-saved" class="px-5 py-2 font-mono text-[10px] font-bold uppercase rounded-lg bg-foreground text-background transition-all">Saved</button>
        <button id="tab-interested" class="px-5 py-2 font-mono text-[10px] font-bold uppercase rounded-lg text-foreground hover:bg-foreground/5 transition-all">Interested ♥</button>
        <button id="tab-applied" class="px-5 py-2 font-mono text-[10px] font-bold uppercase rounded-lg text-foreground hover:bg-foreground/5 transition-all">Applied</button>
      </div>
    </div>

    <!-- Opportunities List -->
    <div id="list-container" class="space-y-4">
      <!-- Dynamically rendered list cards -->
      <div class="text-center font-mono text-xs uppercase text-muted-foreground py-10">Loading saved items...</div>
    </div>

  </main>

  <!-- Career Momentum Battery Section -->
  <section id="momentum-wrap" class="hidden max-w-4xl mx-auto px-6 pb-16">
    <div class="border-2 border-foreground rounded-3xl p-8 shadow-stamp">

      <!-- Label row -->
      <div class="flex items-center justify-between mb-5">
        <div>
          <div class="font-mono text-[10px] uppercase tracking-widest text-muted-foreground">Your progress</div>
          <div class="font-display text-3xl uppercase tracking-tight leading-none mt-0.5">Career Momentum</div>
        </div>
        <div class="text-right">
          <div id="momentum-pct" class="font-display text-5xl leading-none font-bold"></div>
          <div class="font-mono text-[9px] uppercase tracking-widest text-muted-foreground mt-1">Overall Score</div>
        </div>
      </div>

      <!-- Battery body -->
      <div class="flex items-center gap-2">
        <!-- 10 segmented cells -->
        <div class="flex-1 flex gap-1.5">
          <div id="batt-1"  class="h-8 flex-1 rounded-md bg-foreground/10 transition-all duration-500"></div>
          <div id="batt-2"  class="h-8 flex-1 rounded-md bg-foreground/10 transition-all duration-500"></div>
          <div id="batt-3"  class="h-8 flex-1 rounded-md bg-foreground/10 transition-all duration-500"></div>
          <div id="batt-4"  class="h-8 flex-1 rounded-md bg-foreground/10 transition-all duration-500"></div>
          <div id="batt-5"  class="h-8 flex-1 rounded-md bg-foreground/10 transition-all duration-500"></div>
          <div id="batt-6"  class="h-8 flex-1 rounded-md bg-foreground/10 transition-all duration-500"></div>
          <div id="batt-7"  class="h-8 flex-1 rounded-md bg-foreground/10 transition-all duration-500"></div>
          <div id="batt-8"  class="h-8 flex-1 rounded-md bg-foreground/10 transition-all duration-500"></div>
          <div id="batt-9"  class="h-8 flex-1 rounded-md bg-foreground/10 transition-all duration-500"></div>
          <div id="batt-10" class="h-8 flex-1 rounded-md bg-foreground/10 transition-all duration-500"></div>
        </div>
        <!-- Battery nub -->
        <div class="w-2.5 h-4 rounded-r-sm border-2 border-foreground/30"></div>
      </div>

      <!-- Signal breakdown -->
      <div id="momentum-signals" class="mt-5 flex flex-wrap gap-x-6 gap-y-1"></div>

      <!-- Nudge message -->
      <p id="momentum-nudge" class="hidden mt-4 font-mono text-[11px] uppercase tracking-widest text-muted-foreground border-l-2 border-primary pl-3"></p>
    </div>
  </section>

  <!-- Footer -->
  <footer class="border-t-2 border-foreground/10 mt-8 py-10">
    <div class="max-w-6xl mx-auto px-6 flex flex-col md:flex-row justify-between items-start gap-6">
      <div>
        <div class="font-display text-3xl uppercase tracking-tighter italic">LOOP.</div>
        <p class="font-mono text-[10px] uppercase text-muted-foreground tracking-widest mt-2">v.03 — built for the curious</p>
      </div>
      <div class="font-mono text-[10px] uppercase tracking-widest text-muted-foreground">
        © 2026 · No more missed deadlines.
      </div>
    </div>
  </footer>

  <script src="/common.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // Guard page
      const user = await requireAuth();
      if (!user) return;

      renderHeader(user);
      initMarqueeTicker();

      const initialTabParam = new URLSearchParams(window.location.search).get("tab");
      let activeTab = initialTabParam === "interested" ? "interested" : (initialTabParam === "applied" ? "applied" : "saved");
      let profileData = null;
      let matchedOpps = [];

      function updateTabButtonsUI() {
        const btnSaved = document.getElementById("tab-saved");
        const btnInterested = document.getElementById("tab-interested");
        const btnApplied = document.getElementById("tab-applied");
        const pageTitle = document.getElementById("page-title");
        const pageSubtitle = document.getElementById("page-subtitle");

        const activeCls = "px-5 py-2 font-mono text-[10px] font-bold uppercase rounded-lg bg-foreground text-background transition-all shadow-xs";
        const inactiveCls = "px-5 py-2 font-mono text-[10px] font-bold uppercase rounded-lg text-foreground hover:bg-foreground/5 transition-all";

        btnSaved.className = activeTab === "saved" ? activeCls : inactiveCls;
        btnInterested.className = activeTab === "interested" ? activeCls : inactiveCls;
        btnApplied.className = activeTab === "applied" ? activeCls : inactiveCls;

        if (activeTab === "saved") {
          pageTitle.innerHTML = `Saved Items<span class="text-primary">.</span>`;
          pageSubtitle.textContent = `Your Watchlist · ${document.getElementById("current-month").textContent}`;
        } else if (activeTab === "interested") {
          pageTitle.innerHTML = `Interested<span class="text-primary"> ♥</span>`;
          pageSubtitle.textContent = `Your Shortlist · Swiped right & high priority`;
        } else {
          pageTitle.innerHTML = `Applied<span class="text-primary">.</span>`;
          pageSubtitle.textContent = `Applications Pipeline · Tracked submissions`;
        }
      }

      // Fetch opportunities data
      async function loadSavedData() {
        const listContainer = document.getElementById("list-container");
        listContainer.innerHTML = `<div class="text-center font-mono text-xs uppercase text-muted-foreground py-12 flex flex-col items-center gap-2"><div class="size-6 border-2 border-primary border-t-transparent rounded-full animate-spin"></div><span>Loading ${activeTab} items...</span></div>`;

        try {
          const profileRes = await fetch("/api/user/profile");
          if (!profileRes.ok) return;
          profileData = await profileRes.json();

          const idsToFetch = activeTab === "saved" 
            ? (profileData.saved || []) 
            : activeTab === "interested"
            ? (profileData.interested || [])
            : (profileData.applied || []);

          if (!idsToFetch || idsToFetch.length === 0) {
            renderEmptyState();
            return;
          }

          const oppsRes = await fetch("/api/opportunities/by-ids", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ids: idsToFetch })
          });

          if (oppsRes.ok) {
            matchedOpps = await oppsRes.json();
            renderList();
          } else {
            renderEmptyState();
          }
        } catch (err) {
          console.error(`Failed to load ${activeTab} opportunities:`, err);
          listContainer.innerHTML = `<div class="text-center font-mono text-xs uppercase text-destructive py-10">Error loading ${activeTab} items.</div>`;
        }
      }

      function renderEmptyState() {
        const listContainer = document.getElementById("list-container");
        const emptyLabel = activeTab === "saved"
          ? "No saved opportunities yet."
          : activeTab === "interested"
          ? "No opportunities marked interested yet."
          : "No applications submitted yet.";
        const emptySubtitle = activeTab === "saved"
          ? "Bookmarked listings from your feed will be saved here."
          : activeTab === "interested"
          ? "Swipe right or click the heart on any card to shortlist it here."
          : "Mark listings as applied in the feed or tracker to view submissions.";

        listContainer.innerHTML = `
          <div class="border-2 border-dashed border-foreground/20 rounded-3xl p-16 text-center animate-entry">
            <p class="font-display text-4xl uppercase">${emptyLabel}</p>
            <p class="font-mono text-xs uppercase tracking-widest text-muted-foreground mt-2">
              ${emptySubtitle}
            </p>
            <div class="mt-6 flex items-center justify-center gap-3">
              <a href="/" class="bg-foreground text-background px-6 py-3 rounded-xl font-mono text-xs font-bold uppercase hover:bg-primary transition-all">Explore Feed</a>
              <a href="/?tab=discover" class="border-2 border-foreground px-6 py-3 rounded-xl font-mono text-xs font-bold uppercase hover:bg-foreground/5 transition-all">Discover All</a>
            </div>
          </div>
        `;
      }

      function renderList() {
        const listContainer = document.getElementById("list-container");
        if (!matchedOpps || matchedOpps.length === 0) {
          renderEmptyState();
          return;
        }

        listContainer.innerHTML = matchedOpps.map(opp => {
          return renderOpportunityCard(opp, profileData, {
            isSaved: (profileData.saved || []).includes(opp.id),
            isInterested: (profileData.interested || []).includes(opp.id),
            isApplied: (profileData.applied || []).includes(opp.id)
          });
        }).join("");

        if (window.lucide) window.lucide.createIcons();

        // Attach listeners for save, interested, apply, and why drawer
        attachOpportunityCardListeners(listContainer, {
          onAfterSave: (id, isSaved) => {
            if (isSaved) {
              if (!profileData.saved.includes(id)) profileData.saved.push(id);
            } else {
              profileData.saved = profileData.saved.filter(s => s !== id);
              if (activeTab === "saved") {
                matchedOpps = matchedOpps.filter(o => o.id !== id);
                renderList();
              }
            }
          },
          onAfterInterested: (id, isInterested) => {
            if (isInterested) {
              if (!profileData.interested.includes(id)) profileData.interested.push(id);
            } else {
              profileData.interested = profileData.interested.filter(s => s !== id);
              if (activeTab === "interested") {
                matchedOpps = matchedOpps.filter(o => o.id !== id);
                renderList();
              }
            }
          }
        });
      }

      // Tab toggling events
      const btnSaved = document.getElementById("tab-saved");
      const btnInterested = document.getElementById("tab-interested");
      const btnApplied = document.getElementById("tab-applied");

      btnSaved?.addEventListener("click", () => {
        if (activeTab === "saved") return;
        activeTab = "saved";
        updateTabButtonsUI();
        loadSavedData();
      });

      btnInterested?.addEventListener("click", () => {
        if (activeTab === "interested") return;
        activeTab = "interested";
        updateTabButtonsUI();
        loadSavedData();
      });

      btnApplied?.addEventListener("click", () => {
        if (activeTab === "applied") return;
        activeTab = "applied";
        updateTabButtonsUI();
        loadSavedData();
      });

      // Set current month label
      document.getElementById("current-month").textContent =
        new Date().toLocaleDateString("en-US", { month: "long", year: "numeric" });

      updateTabButtonsUI();
      // Initial load
      loadSavedData();
    });
  </script>

  <script>
    function computeAndRenderMomentum(profileData) {
      const wrap   = document.getElementById("momentum-wrap");
      const pctEl  = document.getElementById("momentum-pct");
      const nudge  = document.getElementById("momentum-nudge");
      const sigBox = document.getElementById("momentum-signals");
      if (!wrap) return;

      // ── Score signals ─────────────────────────────────────────────────
      const notes = [];

      // 1. Profile completeness (25 pts)
      const p = profileData.profile || {};
      const profileFields = [p.name, p.field, p.future_you,
        (p.skills  || []).length > 0,
        (p.interests || []).length > 0,
        p.university, p.year_of_study, p.bio
      ];
      const filled = profileFields.filter(Boolean).length;
      const profileScore = Math.round((filled / profileFields.length) * 25);
      if (profileScore < 15) notes.push("Complete your profile to boost visibility.");

      // 2. Applications (25 pts)
      const appliedCount = (profileData.applied || []).length;
      const appliedScore = Math.min(25, appliedCount * 5);
      if (appliedCount === 0) notes.push("No applications yet — start applying!");

      // 3. Saved pipeline depth (20 pts)
      const savedScore = Math.min(20, (profileData.saved || []).length * 4);

      // 4. Projects (15 pts)
      const projectCount = (p.projects || []).length;
      const projectScore = Math.min(15, projectCount * 5);
      if (projectCount === 0) notes.push("Add projects to your profile.");

      // 5. Activity (15 pts, penalised for idle days)
      const LAST_VISIT_KEY = "loop_last_visit";
      const now = Date.now();
      const lastVisit = parseInt(localStorage.getItem(LAST_VISIT_KEY) || String(now), 10);
      localStorage.setItem(LAST_VISIT_KEY, String(now));
      const idleDays = Math.floor((now - lastVisit) / (1000 * 60 * 60 * 24));
      const activityScore = Math.max(0, 15 - idleDays * 2);
      if (idleDays >= 5) notes.push(`You've been inactive for ${idleDays} day${idleDays !== 1 ? "s" : ""}.`);

      const total = profileScore + appliedScore + savedScore + projectScore + activityScore;

      // ── Colour thresholds ─────────────────────────────────────────────
      const colour = total >= 70 ? "#22c55e" : total >= 40 ? "#f59e0b" : "#ef4444";

      // ── Show section ──────────────────────────────────────────────────
      wrap.classList.remove("hidden");

      // Big percentage
      pctEl.textContent  = total + "%";
      pctEl.style.color  = colour;

      // ── Battery cells (10 cells, each = 10%) ─────────────────────────
      const filledCells = Math.round(total / 10);
      for (let i = 1; i <= 10; i++) {
        const cell = document.getElementById("batt-" + i);
        if (!cell) continue;
        if (i <= filledCells) {
          // stagger the fill for a charging animation
          setTimeout(() => {
            cell.style.backgroundColor = colour;
            cell.style.opacity = "1";
          }, i * 60);
        }
      }

      // ── Signal chips ──────────────────────────────────────────────────
      const chips = [
        { label: "Profile",      score: profileScore,  max: 25 },
        { label: "Applications", score: appliedScore,  max: 25 },
        { label: "Pipeline",     score: savedScore,    max: 20 },
        { label: "Projects",     score: projectScore,  max: 15 },
        { label: "Activity",     score: activityScore, max: 15 },
      ];
      if (sigBox) {
        sigBox.innerHTML = chips.map(c => `
          <div class="flex items-center gap-1.5">
            <span class="font-mono text-[9px] uppercase tracking-widest text-muted-foreground">${c.label}</span>
            <span class="font-mono text-[10px] font-bold" style="color:${colour}">${c.score}/${c.max}</span>
          </div>
        `).join("");
      }

      // ── Nudge ─────────────────────────────────────────────────────────
      if (notes.length > 0 && nudge) {
        nudge.textContent = notes[0];
        nudge.classList.remove("hidden");
      }
    }

    // Poll until profileData is available in outer scope, then render
    (function waitForProfile() {
      // profileData is declared in the outer DOMContentLoaded closure
      // We reach it by patching loadSavedData's completion signal via MutationObserver
      // Instead, we re-fetch profile ourselves for isolation
      fetch("/api/user/profile").then(r => r.ok ? r.json() : null).then(data => {
        if (data) computeAndRenderMomentum(data);
      }).catch(() => {});
    })();
  </script>
</body>
</html>
